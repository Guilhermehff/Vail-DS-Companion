validation:
  perceptual_consistency_notes:
  - "The older Mad River repo state was based on superseded brand guidance that used `river_blue` as the primary expressive lane."
  - This artifact intentionally replaces that old source set with a repo-only proposal based on the updated guideline image supplied on 2026-04-21.
  - "`Mad Black` is staged as the primary family at `700_source`, with darker `800` and `900` steps preserved behind it."
  - "`Mountain Green` is the approved supporting expressive family for `brand_secondary/*`."
  - "`Nav Grey` remains a governed global-only family in this pass."
  contrast_checks:
  - token: mad_river_mountain/mad_black/900
    foreground: white
    ratio: 19.32:1
    result: pass
  - token: mad_river_mountain/mountain_green/700_source
    foreground: white
    ratio: 9.78:1
    result: pass
  - token: mad_river_mountain/nav_grey/700_source
    foreground: white
    ratio: 8.51:1
    result: pass
semantic_recommendations:
  role_sets:
  - scope: neutral
    source_family: inherited_base
    rationale: This proposal does not force a branded neutral semantic remap until
      the new source set is approved for live Figma.
  - scope: brand
    source_family: mad_river_mountain/mad_black
    rationale: The updated guideline positions Mad Black as the core primary brand
      color.
  - scope: brand_secondary
    source_family: mad_river_mountain/mountain_green
    rationale: Mountain Green is the approved supporting expressive lane for this
      pass.
  global_only_families:
  - mad_river_mountain/nav_grey
  role_exceptions:
  - target: variables/assets/logo
    source_token: Mad River Mountain
review_readiness:
  review_rules:
  - subject: Mad River Mountain primary expressive mapping
    rule: "Promote `mad_black` to the `brand/*` semantic lane when the live write is approved."
  - subject: Mad River Mountain supporting expressive mapping
    rule: "Use `mountain_green` for `brand_secondary/*`; keep `nav_grey` global-only unless a later semantic neutral decision is approved."
open_questions: []
