color_proportion_guidance:
  status: active
  source_basis: The supplied Kirkwood visual-guidelines page states that black, white,
    and gray should dominate the design when blue tones are already present through
    outdoor photography, and that orange should be used as the highlight. The adjacent
    pie chart describes content distribution rather than a direct color percentage
    table.
  contexts:
  - name: outdoor_photography_compositions
    intent: Foundational neutrals dominate. Orange 021 C stays as the main highlight
      color. The blue accents should usually arrive through photography or smaller
      supporting moments rather than as the leading solid field.
    dominant_palette:
    - source_color: White
      token: universal/white
    - source_color: Cool Grey 1
      token: kirkwood/cool_gray/200_source
    - source_color: Cool Grey 9
      token: kirkwood/cool_gray/700_source
    - source_color: Black C
      token: universal/black
    supporting_palette:
    - source_color: Orange 021 C
      token: kirkwood/orange/500_source
    - source_color: 642 C
      token: kirkwood/blue/300_source
    - source_color: 633 C
      token: kirkwood/blue/600_source
    - source_color: 648 C
      token: kirkwood/blue/700_source
    notes:
    - The source explicitly says orange is used as the highlight.
    - The source explicitly says the palette blues often occur naturally in outdoor
      photography.
validation:
  perceptual_consistency_notes:
  - Orange 021 C lands at `500` because the supplied swatch behaves as a vivid mid-tone
    highlight rather than a dark foundation color.
  - '`633 C` now anchors `600` and `648 C` now anchors `700`, with the surrounding
    Kirkwood blue accent steps recalculated from those approved source positions.'
  - The approved Kirkwood neutral family uses a softened working ladder with exact
    source anchors at `200` for Cool Grey 1 and `700` for Cool Grey 9, while intentionally
    avoiding pure white and pure black at the outer steps.
  contrast_checks:
  - token: kirkwood/orange/500_source
    foreground: black
    ratio: 6.24:1
    result: pass
  - token: kirkwood/blue/700_source
    foreground: white
    ratio: 9.38:1
    result: pass
  - token: kirkwood/blue/600_source
    foreground: white
    ratio: 5.33:1
    result: pass
