validation:
  perceptual_consistency_notes:
  - Live Figma now carries five Liberty Mountain raw color families instead of the earlier nine-family repo snapshot.
  - '`sunrise`, `spring`, `flora`, and `copper` are preserved as source provenance only and are no longer live raw families.'
  - The shared semantic neutral role set remains inherited from the base collection.
  contrast_checks:
  - token: liberty_mountain/cool_neutral/700
    foreground: universal/white
    ratio: live_figma_verified
    result: pass
  - token: liberty_mountain/warm_neutral/300
    foreground: universal/black
    ratio: live_figma_verified
    result: pass
semantic_recommendations:
  role_sets:
  - scope: neutral
    source_family: inherited_base
    rationale: The live semantic neutral role set remains inherited from the base collection.
    targets:
    - color/surface/neutral/*
    - color/on_surface/neutral/*
    - color/foreground/default
    - color/foreground/subtle
    - color/border/default
    - color/border/subtle
  - scope: brand
    source_family: liberty_mountain/cool_neutral
    rationale: The live expressive brand lane now resolves through the cool neutral family.
    targets:
    - color/surface/brand/*
    - color/on_surface/brand/*
    - color/foreground/brand
    - color/border/brand
  - scope: brand_secondary
    source_family: liberty_mountain/warm_neutral
    rationale: The live expressive secondary lane now resolves through the warm neutral family.
    targets:
    - color/surface/brand_secondary/*
    - color/on_surface/brand_secondary/*
    - color/foreground/brand_secondary
    - color/border/brand_secondary
  global_only_families:
  - family: liberty_mountain/shale
    rationale: Preserved as a live raw family outside the current semantic mapping.
  - family: liberty_mountain/stone
    rationale: Preserved as a live raw family outside the current semantic mapping.
  - family: liberty_mountain/sunset
    rationale: Preserved as a live raw family outside the current semantic mapping.
  role_exceptions:
  - target: variables/assets/logo
    source_token: Liberty Mountain
    rationale: The live semantic extension resolves the logo-name string to the brand display name.
review_readiness:
  intended_review_channels:
  - web
  - email
  - ads
  review_rules:
  - subject: Liberty Mountain live lane mapping
    channels:
    - web
    - email
    - ads
    rule: 'Treat `cool_neutral` as the live expressive brand lane and `warm_neutral` as the live expressive secondary lane until a newer governance decision changes the semantic mapping.'
    source_basis: Live Figma semantic extension state.
  - subject: Liberty Mountain removed raw families
    channels:
    - web
    - email
    - ads
    rule: 'Do not treat `sunrise`, `spring`, `flora`, or `copper` as live `_Global: Color` families.'
    source_basis: 'Live Figma `_Global: Color` inventory.'
