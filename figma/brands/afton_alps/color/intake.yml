validation:
  perceptual_consistency_notes:
  - The earlier repo source for Afton blue was incorrect. Live Figma now reflects the corrected source set supplied on 2026-04-21.
  - St. Croix Blue now lands at `afton_alps/blue/700_source`, with the darker `800` and `900` values rebuilt around that corrected source anchor.
  - Valley Violet now lands at `afton_alps/blue/300` inside the live blue family.
  - Live Figma preserves Meadow Yellow at `afton_alps/meadow_yellow/400_source`.
  - Live Figma carries `afton_alps/bluff_gray/*` with Bluff Gray anchored on `bluff_gray/700`.
  - The first semantic pass inherits the shared neutral role set because no branded
    neutral swatch was supplied.
  - The primary blue semantic lane uses the rebuilt blue family, with the corrected source no longer treated as a `900` anchor.
  contrast_checks:
  - token: afton_alps/blue/900
    foreground: white
    ratio: 13.55:1
    result: pass
  - token: afton_alps/meadow_yellow/700
    foreground: white
    ratio: 7.01:1
    result: pass
  - token: afton_alps/meadow_yellow/400_source
    foreground: black
    ratio: 11.47:1
    result: pass
semantic_recommendations:
  role_sets:
  - scope: neutral
    source_family: inherited_base
    rationale: No Afton Alps neutral swatches were supplied, so the shared neutral
      role set remains inherited from the semantic base collection.
    targets:
    - color/surface/neutral/*
    - color/on_surface/neutral/*
    - color/foreground/default
    - color/foreground/subtle
    - color/border/default
    - color/border/subtle
  - scope: brand
    source_family: afton_alps/blue
    rationale: Blue is the user-approved primary expressive lane and behaves as a
      dark brand family.
    targets:
    - color/surface/brand/*
    - color/on_surface/brand/*
    - color/foreground/brand
    - color/border/brand
  - scope: brand_secondary
    source_family: afton_alps/meadow_yellow
    rationale: The live secondary expressive lane resolves through `afton_alps/meadow_yellow`.
    targets:
    - color/surface/brand_secondary/*
    - color/on_surface/brand_secondary/*
    - color/foreground/brand_secondary
    - color/border/brand_secondary
  global_only_families:
  - afton_alps/bluff_gray
  role_exceptions:
  - target: variables/assets/logo
    source_token: Afton Alps
    rationale: 'The live `Semantic: Theme` schema includes `variables/assets/logo`,
      and each brand extension overrides it to the brand display name string.'
